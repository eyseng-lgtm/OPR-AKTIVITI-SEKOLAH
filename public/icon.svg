<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Document Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main page -->
    <path d="M128 96 H320 L384 160 V416 C384 429 373 440 360 440 H128 C115 440 104 429 104 416 V120 C104 107 115 96 128 96 Z" fill="#ffffff" />
    <!-- Page Fold -->
    <path d="M320 96 V152 C320 156 324 160 328 160 H384 Z" fill="url(#fold)" />
  </g>

  <!-- Document Header Bar -->
  <rect x="136" y="128" width="168" height="24" rx="4" fill="#2563eb" />

  <!-- Text lines in document -->
  <rect x="136" y="184" width="216" height="12" rx="6" fill="#94a3b8" />
  <rect x="136" y="212" width="180" height="12" rx="6" fill="#cbd5e1" />
  <rect x="136" y="240" width="216" height="12" rx="6" fill="#cbd5e1" />

  <!-- 2 Photo placeholders -->
  <rect x="136" y="276" width="100" height="74" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" />
  <circle cx="166" cy="300" r="10" fill="#60a5fa" />
  <path d="M142 342 L168 318 L188 334 L212 308 L230 342 Z" fill="#3b82f6" />

  <rect x="252" y="276" width="100" height="74" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" />
  <circle cx="282" cy="300" r="10" fill="#60a5fa" />
  <path d="M258 342 L284 318 L304 334 L328 308 L346 342 Z" fill="#3b82f6" />

  <!-- Signature line at bottom -->
  <line x1="136" y1="390" x2="216" y2="390" stroke="#64748b" stroke-width="3" stroke-dasharray="4 2" />
  <line x1="272" y1="390" x2="352" y2="390" stroke="#64748b" stroke-width="3" stroke-dasharray="4 2" />

  <!-- Certified Golden Stamp/Seal -->
  <g transform="translate(360, 370)">
    <circle cx="0" cy="0" r="46" fill="#f59e0b" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fef3c7" stroke-width="2" stroke-dasharray="3 3" />
    <path d="M-12 18 L-22 52 L-4 44 L14 52 L4 18 Z" fill="#d97706" />
    <text x="0" y="6" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">OPR</text>
  </g>
</svg>
